<title>BRYC Front Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: teal-to-purple masthead with scenario controls, a scoreboard strip of key numbers, tabbed workspace, checks rail on the right at desktop width */
:root,.pdf-host{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF1; --ink:#1B1C22; --muted:#5E626D; --line:#DFE2E7; --line-strong:#C2C7CF;
  --mast:linear-gradient(118deg,#2E1065 0%,#4C1D95 48%,#0F766E 100%); --mast-ink:#F7F4FF; --mast-muted:#D4CBEF; --mast-line:rgba(255,255,255,.14); --mast-edge:rgba(255,255,255,.38);
  --accent:#6D28D9; --accent-ink:#FFFFFF; --link:#0F766E;
  --pop:#14B8A6; --pop-ink:#0F766E; --pop-soft:#D5F5F0; --pop-on:#04211E;
  --teal-ink:#0F766E; --purple-ink:#6D28D9;
  --v-hustle:#0F766E; --v-integrity:#6D28D9; --v-community:#BE185D;
  --lv-chief:#7C3AED; --lv-director:#0F9F8F; --lv-manager:#EB6834;
  --t-program:#0F766E; --t-program-bg:#D5F5F0;
  --t-support:#6D28D9; --t-support-bg:#EEE5FE;
  --t-admin:#C2410C; --t-admin-bg:#FFE8D9;
  --t-exec:#BE185D; --t-exec-bg:#FCE4F0;
  --crit:#C81E4A; --crit-bg:#FDE4EA; --warn:#A65A00; --warn-bg:#FDF0D8; --info:#5E626D; --info-bg:#ECEEF1; --ok:#0F766E; --ok-bg:#D5F5F0;
  --focus:#14B8A6;
  --shadow:0 1px 2px rgba(20,22,28,.07),0 4px 12px rgba(20,22,28,.05);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Proxima Nova","Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --surface:#1A1B20; --surface-2:#23252B; --ink:#ECEDF0; --muted:#A3A7B1; --line:#2F3138; --line-strong:#474A53;
    --mast:linear-gradient(118deg,#1C0A42 0%,#341372 48%,#0B524C 100%); --mast-ink:#F7F4FF; --mast-muted:#C5BBE6; --mast-line:rgba(255,255,255,.12); --mast-edge:rgba(255,255,255,.3);
    --accent:#7C3AED; --accent-ink:#FFFFFF; --link:#5EEAD4;
    --pop:#2DD4BF; --pop-ink:#5EEAD4; --pop-soft:#0F3A36; --pop-on:#04211E;
    --teal-ink:#5EEAD4; --purple-ink:#C4B5FD;
    --v-hustle:#2DD4BF; --v-integrity:#A78BFA; --v-community:#F472B6;
    --lv-chief:#8B5CF6; --lv-director:#12A594; --lv-manager:#E8682F;
    --t-program:#5EEAD4; --t-program-bg:#0F3A36;
    --t-support:#C4B5FD; --t-support-bg:#2E1F5C;
    --t-admin:#FDBA74; --t-admin-bg:#44230D;
    --t-exec:#F9A8D4; --t-exec-bg:#4A1531;
    --crit:#FB7185; --crit-bg:#461626; --warn:#FCD34D; --warn-bg:#3D2B08; --info:#A3A7B1; --info-bg:#23252B; --ok:#5EEAD4; --ok-bg:#0F3A36;
    --focus:#2DD4BF; --shadow:0 1px 2px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1A1B20; --surface-2:#23252B; --ink:#ECEDF0; --muted:#A3A7B1; --line:#2F3138; --line-strong:#474A53;
  --mast:linear-gradient(118deg,#1C0A42 0%,#341372 48%,#0B524C 100%); --mast-ink:#F7F4FF; --mast-muted:#C5BBE6; --mast-line:rgba(255,255,255,.12); --mast-edge:rgba(255,255,255,.3);
  --accent:#7C3AED; --accent-ink:#FFFFFF; --link:#5EEAD4;
  --pop:#2DD4BF; --pop-ink:#5EEAD4; --pop-soft:#0F3A36; --pop-on:#04211E;
  --teal-ink:#5EEAD4; --purple-ink:#C4B5FD;
  --v-hustle:#2DD4BF; --v-integrity:#A78BFA; --v-community:#F472B6;
  --lv-chief:#8B5CF6; --lv-director:#12A594; --lv-manager:#E8682F;
  --t-program:#5EEAD4; --t-program-bg:#0F3A36;
  --t-support:#C4B5FD; --t-support-bg:#2E1F5C;
  --t-admin:#FDBA74; --t-admin-bg:#44230D;
  --t-exec:#F9A8D4; --t-exec-bg:#4A1531;
  --crit:#FB7185; --crit-bg:#461626; --warn:#FCD34D; --warn-bg:#3D2B08; --info:#A3A7B1; --info-bg:#23252B; --ok:#5EEAD4; --ok-bg:#0F3A36;
  --focus:#2DD4BF; --shadow:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link);padding:4px 6px}
.btn.ghost:hover{text-decoration:underline}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg.xs{margin-top:8px}
.seg.xs button{padding:2px 9px;font-size:11.5px;white-space:nowrap}
.cost-lines{display:grid;grid-template-columns:1fr auto;gap:0 6px;font-size:11.5px;color:var(--muted);margin-top:3px}
.cost-lines span{white-space:nowrap}
.cost-lines b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.t-sub b{font-weight:600;color:var(--ink)}

/* masthead */
.mast{background:var(--mast);color:var(--mast-ink);border-bottom:4px solid var(--pop)}
.mast-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-mark{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--pop-on);background:var(--pop);padding:2px 8px;border-radius:6px;transform:rotate(-3deg);display:inline-block}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:uppercase}
.scen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1 1 420px;min-width:0}
.scen select option{background:var(--surface);color:var(--ink)}
.scen select{background:var(--mast-line);color:var(--mast-ink);border:1px solid var(--mast-edge);border-radius:8px;padding:6px 10px;font-weight:600;max-width:100%;min-width:0}
.kind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.kind.current{background:var(--pop);color:var(--pop-on)}
.kind.draft{border:1px solid var(--mast-muted);color:var(--mast-muted)}
.mast .btn{background:transparent;border-color:var(--mast-edge);color:var(--mast-ink)}
.mast .btn:hover{border-color:var(--mast-ink)}
.save{font-size:12.5px;color:var(--mast-muted);margin-left:auto}
.save.err{color:#FFC9BF}

/* scoreboard */
.strip{background:var(--surface);border-bottom:1px solid var(--line)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;padding-block:0}
.tile{padding:12px 14px 12px 0;border-right:1px solid var(--line);margin-right:14px;min-width:0;text-align:left;background:none;border-top:0;border-bottom:0;border-left:0;color:inherit}
.tile:last-child{border-right:0}
.t-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-num{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.t-num.c1{color:var(--teal-ink)}
.t-num.c2{color:var(--purple-ink)}
.t-num small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);margin-left:4px}
.t-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.t-sub b{color:var(--ink);font-weight:600}
.mix{display:flex;height:10px;border-radius:3px;overflow:hidden;margin:9px 0 6px;background:var(--surface-2)}
.mix span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:2px 8px}
.legend button{border:0;background:none;padding:0;font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.legend button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.sw.program,.mix .program{background:var(--t-program)}
.sw.support,.mix .support{background:var(--t-support)}
.sw.admin,.mix .admin{background:var(--t-admin)}
.sw.exec,.mix .exec{background:var(--t-exec)}
.tile-checks{cursor:pointer}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cnt{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.cnt.crit{background:var(--crit-bg);color:var(--crit)}
.cnt.warn{background:var(--warn-bg);color:var(--warn)}
.cnt.info{background:var(--info-bg);color:var(--info)}
.cnt.ok{background:var(--ok-bg);color:var(--ok)}

/* tabs */
.tabs-band{border-bottom:1px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--purple-ink);border-bottom-color:var(--pop)}
.tabs .badge{font-size:11px;font-weight:700;background:var(--warn-bg);color:var(--warn);padding:1px 6px;border-radius:999px;margin-left:5px}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-block:18px 60px}
@media (min-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 300px}}
main{min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px}
.toolbar .spacer{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;text-transform:uppercase;margin-bottom:10px;color:var(--purple-ink)}
.panel h3{font-size:14px;font-weight:700;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}

/* person cards */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px;cursor:pointer;box-shadow:var(--shadow);min-width:0;user-select:none}
.card:hover{border-color:var(--pop);transform:translateY(-1px)}
.card.sel{outline:2px solid var(--pop);outline-offset:1px}
.card.unfilled{background:transparent;border-style:dashed;border-color:var(--line-strong);box-shadow:none}
.card.unfilled .c-name{font-style:italic;color:var(--muted)}
.card.dim{opacity:.32}
.card.dragging{opacity:.4}
.c-name{font-weight:700;font-size:13.5px;line-height:1.25;padding-right:12px;overflow-wrap:anywhere}
.c-title{font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px;overflow-wrap:anywhere}
.c-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.c-meta span{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;white-space:nowrap}
.ty-program .ty{background:var(--t-program-bg);color:var(--t-program)}
.ty-support .ty{background:var(--t-support-bg);color:var(--t-support)}
.ty-admin .ty{background:var(--t-admin-bg);color:var(--t-admin)}
.ty-exec .ty{background:var(--t-exec-bg);color:var(--t-exec)}
.nts{background:var(--surface-2);color:var(--ink)}
.nts.full{background:var(--ok-bg);color:var(--ok)}
.nts.over{background:var(--crit-bg);color:var(--crit)}
.fte{background:var(--surface-2);color:var(--muted)}
.st.leaving{background:var(--warn-bg);color:var(--warn)}
.st.open,.st.planned{background:var(--pop-soft);color:var(--pop-ink)}
.flag{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
.flag.crit{background:var(--crit)}
.flag.warn{background:var(--warn)}
.dot-line{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}

/* roster matrix */
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.matrix{display:grid;gap:1px;background:var(--line);min-width:1060px}
.mx-corner,.mx-col,.mx-row,.mx-cell{background:var(--bg)}
.mx-col{padding:10px 10px 8px;position:sticky;top:0}
.mx-col .nm{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em;color:var(--purple-ink)}
.mx-col .sub{font-size:11.5px;color:var(--muted)}
.mx-row{padding:10px;position:sticky;left:0;z-index:1;background:var(--surface-2)}
.mx-row .nm{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;color:var(--teal-ink)}
.mx-row .sub{font-size:11.5px;color:var(--muted)}
.mx-corner{background:var(--surface-2);position:sticky;left:0;z-index:2}
.mx-cell{padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;align-content:start;align-items:start;min-height:64px;min-width:0}
.over-target{background:var(--pop-soft)!important;outline:2px dashed var(--pop);outline-offset:-3px}

/* org chart */
.chart-wrap{overflow-x:auto;padding:16px 8px 24px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.chart{display:inline-flex;flex-direction:column;align-items:center;min-width:100%;gap:18px}
.roots{display:flex;gap:28px;align-items:flex-start}
.node{display:flex;flex-direction:column;align-items:center}
.node>.card{width:190px}
.kids.row{display:flex;gap:14px;position:relative;padding-top:22px;align-items:flex-start}
.kids.row::before{content:"";position:absolute;top:0;left:50%;height:11px;border-left:1.5px solid var(--line-strong)}
.kids.row>.kid{position:relative}
.kids.row>.kid::before{content:"";position:absolute;top:-11px;left:50%;height:11px;border-left:1.5px solid var(--line-strong)}
.kids.row>.kid::after{content:"";position:absolute;top:-11px;left:-7px;right:-7px;border-top:1.5px solid var(--line-strong)}
.kids.row>.kid:first-child::after{left:50%}
.kids.row>.kid:last-child::after{right:50%}
.kids.row>.kid:only-child::after{display:none}
.kids.stack{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-left:12px;border-left:1.5px solid var(--line-strong);width:202px}
.kids.stack .node{align-items:stretch}
.kids.stack .node>.card{width:auto}
.root-drop{border:1.5px dashed var(--line-strong);border-radius:7px;padding:8px 14px;font-size:12.5px;color:var(--muted)}

/* tables */
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl thead th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr.tot th,.tbl tr.tot td{font-weight:700;border-bottom:0}
.tbl-wrap{overflow-x:auto}
input[type=number],input[type=text],select.f,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:5px 7px;min-width:0}
input[type=number]{width:76px;text-align:right;font-variant-numeric:tabular-nums}
input[type=number].wide{width:96px}
textarea{width:100%;resize:vertical;line-height:1.45}
input:disabled,select:disabled,textarea:disabled{opacity:.6}

.form-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.form-grid label{font-size:13px}
.form-grid .help{grid-column:1/-1;margin-top:-4px;font-size:12px;color:var(--muted)}
.callout{border-radius:8px;padding:9px 11px;font-size:13px;background:var(--t-support-bg);color:var(--ink);border:1px solid var(--line-strong)}
.callout b{font-weight:700}

.staff-rows{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.staff-row{display:grid;grid-template-columns:minmax(110px,1.1fr) repeat(3,minmax(0,1fr));gap:6px 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.staff-row:last-child{border-bottom:0}
.staff-row .lab{font-weight:700}
.staff-row .lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.big{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-top:3px}
@media (max-width:560px){.staff-row{grid-template-columns:1fr 1fr}.staff-row .lab{grid-column:1/-1}}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.chips{display:inline-flex;gap:3px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pop);border-color:var(--pop);color:var(--pop-on)}
.chip:disabled{cursor:default}
.nightbar{display:flex;gap:3px;align-items:center}
.nightbar i{display:block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface)}
.nightbar i.on{background:var(--pop);border-color:var(--pop)}
.nightbar i.over{background:var(--crit);border-color:var(--crit)}
.room-list .tbl input[type=text]{width:100%}

/* nights board */
.campus-board{margin-bottom:22px}
.campus-board h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.campus-board h2 span{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.tray{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;min-height:56px;padding:10px;border:1.5px dashed var(--line-strong);border-radius:var(--r);margin-bottom:10px;background:var(--bg)}
.tray-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.tray .coh{width:178px}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.nb{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.nb th,.nb td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top}
.nb thead th{background:var(--surface-2);color:var(--purple-ink);font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px}
.nb tbody th{background:var(--surface-2);text-align:left;font-weight:700;width:120px;position:sticky;left:0;z-index:1}

function derive(s){

    const byNight={};for(const cid of L){const x=placed[cid];if(x)(byNight[x.night]=byNight[x.night]||[]).push(cid);}
    for(const n in byNight) if(byNight[n].length>1) add("crit",`${disp(p)} is booked for ${byNight[n].length} cohorts on ${NIGHT_LONG[n]}.`,{person:p.id});
    if(L.length&&p.status==="leaving") add("warn",`${disp(p)} is leaving but still leads ${L.length} ${pl(L.length,"cohort")}.`,{person:p.id});

  const bandById=Object.fromEntries(s.payBands.map(b=>[b.id,b]));

}

async function flush(){

  saving=true;dirty=false;renderSave();

  catch(err){

function costSub(m,st){
  const names=a=>a.map(p=>shortName(p)).join(", ");
  const row=(l,v)=>`<span>${l}</span><b>${v}</b>`;
  let sub,tip;
  if(m.costActual&&!B.payLoaded){sub=`<div class="t-sub">Loading pay…</div>`;tip="";}
  else if(m.costActual){tip=`Actual current base pay: ${names(m.costActN)}. Band midpoint × FTE: ${names(m.costMidN)||"none"}. Admin and benefits: ${money(st.adminPerFTE)} × FTE for every seat.`;
    sub=`<div class="cost-lines">${row(`Actual pay · ${m.costActN.length}`,moneyK(m.costAct))}${m.costMidN.length?row(`Midpoint · ${m.costMidN.length}`,moneyK(m.costMid)):""}${row("Admin + benefits",moneyK(m.costAdmin))}</div>`;}
  else{tip=`Every seat: (band midpoint + ${money(st.adminPerFTE)} admin and benefits) × FTE`;
    sub=`<div class="cost-lines">${row("Band midpoints",moneyK(m.costMid))}${row("Admin + benefits",moneyK(m.costAdmin))}</div>`;}
  const seg=isAdmin?`<div class="seg xs" role="group" aria-label="Cost based on"><button data-act="cost-mode" data-mode="mid" aria-pressed="${!m.costActual}">Midpoint</button><button data-act="cost-mode" data-mode="actual" aria-pressed="${m.costActual}">Actual</button></div>`:"";
  return `<div title="${esc(tip)}">${sub}</div>${seg}`;
}

/* ---------- roster ---------- */
function cardHTML(p,o){
  o=o||{};
  const L=(D.loads[p.id]||[]).length,max=p.maxNights,un=!isFilled(p),sev=D.personFlags[p.id];
  const nts=(max>0||L>0)?`<span class="nts ${L>max?"over":(L===max&&max>0?"full":"")}" title="Teaching nights: ${L} of ${max}">${L}/${max} nights</span>`:"";
  const fte=p.fte<1?`<span class="fte">${f1(p.fte)} FTE</span>`:"";
  const st=p.status!=="filled"?`<span class="st ${p.status}">${statusName(p.status)}</span>`:"";
  const dot=o.chart&&p.dotted&&D.pById[p.dotted]?`<div class="dot-line">Dotted line to ${esc(shortName(D.pById[p.dotted]))}</div>`:"";
  const nm=p.name||(p.status==="planned"?"Planned hire":"Open seat");
  return `<div class="card ty-${p.type}${un?" unfilled":""}${!o.print&&ui.typeFilter&&ui.typeFilter!==p.type?" dim":""}${!o.print&&ui.editor===p.id?" sel":""}" data-act="open-person" data-person="${esc(p.id)}"${canWrite?' draggable="true"':""}${o.chart?' data-drop="chart-node"':""} tabindex="0" role="button" aria-label="${esc(nm+", "+(p.title||""))}">${sev?`<span class="flag ${sev}" title="${sev==="crit"?"Has a critical check":"Has a warning"}"></span>`:""}<div class="c-name">${esc(nm)}</div><div class="c-title">${esc(p.title||"No title")}</div><div class="c-meta"><span class="ty">${typeName(p.type)}</span>${nts}${fte}${st}</div>${dot}</div>`;
}
function rosterHTML(){
  const teams=S.teams;
  const tool=`<div class="toolbar">
    <div class="seg" role="group" aria-label="Roster view"><button data-act="roster-mode" data-mode="board" aria-pressed="${ui.rosterMode==="board"}">Board</button><button data-act="roster-mode" data-mode="chart" aria-pressed="${ui.rosterMode==="chart"}">Org chart</button></div>
    <button class="btn primary" data-act="add-seat"${dis()}>Add seat</button>
    <button class="btn" data-act="name-open" data-mode="new"${dis()}>Save as new scenario</button>
    <button class="btn" data-act="pdf"${S.people.length?"":" disabled"} title="Board and org chart for “${esc(S.name)}”">Download PDF</button>
    <span class="hint">${canWrite?(ui.rosterMode==="board"?"Drag a card to change team or tier. Click a card to edit.":"Drag a card onto someone to change who they report to. Click a card to edit."):"View only."}</span>
    <span class="spacer"></span>${ui.typeFilter?`<button class="btn sm" data-act="type-filter" data-type="${ui.typeFilter}">Clear highlight: ${typeName(ui.typeFilter)}</button>`:""}
  </div>`;
  if(ui.rosterMode==="chart") return tool+chartHTML();
  return tool+`<div class="matrix-wrap" data-scroll-key="matrix">${boardMatrixHTML()}</div>`;

function boardMatrixHTML(print){
  const teams=S.teams;
  let h=`<div class="matrix" style="grid-template-columns:136px minmax(180px,1fr) minmax(180px,1fr) minmax(360px,2.2fr) minmax(180px,1fr)"><div class="mx-corner"></div>`;
  for(const tier of TIERS){const ps=S.people.filter(p=>p.tier===tier.id);h+=`<div class="mx-col"><div class="nm">${tier.name}</div><div class="sub">${ps.length} ${pl(ps.length,"seat")} · ${f1(ps.reduce((a,p)=>a+p.fte,0))} FTE</div></div>`;}
  for(const t of teams){
    const ps=S.people.filter(p=>p.team===t.id);
    h+=`<div class="mx-row"><div class="nm">${esc(t.name)}</div><div class="sub">${ps.length} ${pl(ps.length,"seat")} · ${f1(ps.reduce((a,p)=>a+p.fte,0))} FTE</div></div>`;
    for(const tier of TIERS){
      const cell=ps.filter(p=>p.tier===tier.id).sort((a,b)=>(isFilled(b)-isFilled(a))||a.name.localeCompare(b.name));
      h+=`<div class="mx-cell" data-drop="roster-cell" data-team="${esc(t.id)}" data-tier="${tier.id}" aria-label="${esc(t.name)}, ${tier.name}">${cell.map(p=>cardHTML(p,{print})).join("")}</div>`;
    }
  }
  return h+"</div>";
}
function chartHTML(print){
  const seen=new Set();
  const node=p=>{
    if(seen.has(p.id))return"";seen.add(p.id);
    const kids=(D.directs[p.id]||[]).map(id=>D.pById[id]).filter(k=>!seen.has(k.id)).sort((a,b)=>TIERS.findIndex(t=>t.id===a.tier)-TIERS.findIndex(t=>t.id===b.tier)||S.teams.findIndex(t=>t.id===a.team)-S.teams.findIndex(t=>t.id===b.team));
    const leafy=kids.every(k=>!(D.directs[k.id]||[]).length);
    return `<div class="node">${cardHTML(p,{chart:true,print})}${kids.length?`<div class="kids ${leafy?"stack":"row"}">${kids.map(k=>`<div class="kid">${node(k)}</div>`).join("")}</div>`:""}</div>`;
  };
  const roots=S.people.filter(p=>!p.reportsTo||!D.pById[p.reportsTo]||p.reportsTo===p.id);
  let body=roots.map(node).join("");
  const rest=S.people.filter(p=>!seen.has(p.id));
  if(rest.length) body+=rest.map(node).join("");
  const chart=`<div class="chart">${canWrite&&!print?`<div class="root-drop" data-drop="chart-root">Drop here to make someone top of the chart</div>`:""}<div class="roots">${body||`<p class="muted">No seats yet. Use Add seat.</p>`}</div></div>`;
  return print?chart:`<div class="chart-wrap" data-scroll-key="chart">${chart}</div>`;
}

/* ---------- program ---------- */
function nightEstimate(cam){
  const est=Object.fromEntries(cam.nights.map(n=>[n,0]));
  for(const b of bandsFor(cam)){const prefs=prefNights(cam,b.key);if(!prefs.length)continue;D.cohorts.filter(c=>c.campus===cam.id&&c.band===b.key).forEach((c,i)=>{const n=prefs[i%prefs.length];if(n in est)est[n]++;});}
  return est;
}

/* ---------- compare ---------- */
function compareHTML(){
  const ids=sortedIds();
  if(ids.length<2) return `<div class="panel"><h2>Compare</h2><p style="margin-top:0">Compare shows what's different between two scenarios: who moved, who's new, and which numbers changed.</p><p class="muted">You have one scenario so far. Use <b>Save as new</b>, try a change on the Roster, then come back here.</p>${canWrite?`<button class="btn primary" data-act="name-open" data-mode="new">Save as new scenario</button>`:""}</div>`;
  const cur=ids.find(id=>scenarios[id].kind==="current")||ids[0];
  let a=ui.cmpA&&scenarios[ui.cmpA]?ui.cmpA:cur,b=ui.cmpB&&scenarios[ui.cmpB]?ui.cmpB:(curId!==a?curId:ids.find(id=>id!==a));
  const get=id=>id===curId?S:normalize(scenarios[id]);
  const A=get(a),Bs=get(b);
  const pick=`<div class="cmp-pick"><label>Start with <select class="f" id="cmpA" data-act="cmpA">${ids.map(id=>opt(id,(scenarios[id].name||"Untitled")+(scenarios[id].kind==="current"?" (current plan)":""),id===a)).join("")}</select></label><span aria-hidden="true">→</span><label>Compare to <select class="f" id="cmpB" data-act="cmpB">${ids.map(id=>opt(id,(scenarios[id].name||"Untitled")+(scenarios[id].kind==="current"?" (current plan)":""),id===b)).join("")}</select></label></div>`;
  const intro=`<p class="hint cmp-intro">Pick two scenarios. You'll see what's different in plain words, then the numbers that moved.</p>`;
  if(a===b)return `<div class="panel"><h2>Compare</h2>${intro}${pick}<p class="muted">Pick two different scenarios.</p></div>`;
  const mA=derive(A).m,mB=derive(Bs).m;
  const rows=[["Fellows","fellows"],["Cohorts","cohorts"],["Learning PMs needed","pmNeeded",1],["Learning PMs on roster","pmRoster",1],["Senior counselors needed","senNeeded",1],["Senior counselors on roster","senRoster",1],["Filled seats","filled"],["Open or planned seats","unfilled"],["Total FTE","fte",1],[mA.costActual?"Est. annual cost (actual pay)":"Est. annual cost (band midpoints)","cost"],["Critical checks","crit"],["Warnings","warn"]];
  const fmtv=(v,k,dec)=>k==="cost"?(v==null?"Not set":money(v)):dec?f1x(v):String(v);
  const tr=rows.map(([l,k,dec])=>{let va=mA[k],vb=mB[k];if(k==="cost"){va=mA.costKnown?va:null;vb=mB.costKnown?vb:null;}
    if(va==null&&vb==null)return "";const d=(va==null||vb==null)?null:vb-va;if(d!=null&&Math.abs(d)<0.05)return "";
    const ds=d==null?"":(d>0?"+":"−")+(k==="cost"?money(Math.abs(d)):dec?f1x(Math.abs(d)):Math.abs(d));
    return `<tr><th>${l}</th><td class="num tnum">${fmtv(va,k,dec)}</td><td class="num tnum">${fmtv(vb,k,dec)}</td><td class="num tnum">${ds}</td></tr>`;}).join("");
  const ch=diffScenarios(A,Bs);
  return `<div class="panel"><h2>Compare</h2>${intro}${pick}
    <h3>What's different${ch.length?` (${ch.length})`:""}</h3>${ch.length?`<ul class="changes">${ch.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="muted">Nothing. These two scenarios match.</p>`}
    <h3 style="margin-top:18px">Numbers that changed</h3>${tr?`<div class="tbl-wrap"><table class="tbl cmp-tbl"><thead><tr><th></th><th class="num">${esc(A.name)}</th><th class="num">${esc(Bs.name)}</th><th class="num">Change</th></tr></thead><tbody>${tr}</tbody></table></div>`:`<p class="muted">None.</p>`}</div>`;
}
function diffScenarios(A,B){
  const out=[],pa=new Map(A.people.map(p=>[p.id,p])),pb=new Map(B.people.map(p=>[p.id,p]));
  const nameIn=(S_,id)=>{const p=S_.people.find(x=>x.id===id);return p?disp(p):"nobody";};
  const teamN=(S_,id)=>(S_.teams.find(t=>t.id===id)||{name:id}).name;
  for(const [id,p] of pb) if(!pa.has(id)) out.push(`<b>Added</b> ${esc(disp(p))} (${esc(p.title||"")}, ${esc(teamN(B,p.team))})`);
  for(const [id,p] of pa) if(!pb.has(id)) out.push(`<b>Removed</b> ${esc(disp(p))} (${esc(p.title||"")})`);
  const la=derive(A).loads,lb=derive(B).loads;
  for(const [id,b] of pb){const a=pa.get(id);if(!a)continue;const parts=[];
    if(a.name!==b.name)parts.push(`name ${esc(a.name||"open")} → ${esc(b.name||"open")}`);
    if(a.title!==b.title)parts.push(`title → ${esc(b.title)}`);
    if(a.team!==b.team)parts.push(`team ${esc(teamN(A,a.team))} → ${esc(teamN(B,b.team))}`);
    if(a.tier!==b.tier)parts.push(`tier ${tierOne(a.tier)} → ${tierOne(b.tier)}`);
    if(a.type!==b.type)parts.push(`type ${typeName(a.type)} → ${typeName(b.type)}`);
    if(a.reportsTo!==b.reportsTo)parts.push(`reports to ${esc(nameIn(A,a.reportsTo))} → ${esc(nameIn(B,b.reportsTo))}`);
    if(a.status!==b.status)parts.push(`${statusName(a.status)} → ${statusName(b.status)}`);
    if(a.fte!==b.fte)parts.push(`FTE ${f1(a.fte)} → ${f1(b.fte)}`);
    if(a.maxNights!==b.maxNights)parts.push(`night limit ${a.maxNights} → ${b.maxNights}`);
    const na=(la[id]||[]).length,nb=(lb[id]||[]).length;if(na!==nb)parts.push(`teaching ${na} → ${nb} ${pl(nb,"night")}`);
    if(parts.length)out.push(`<b>${esc(disp(b))}</b>: ${parts.join("; ")}`);}
  for(const c of B.campuses){const ca=A.campuses.find(x=>x.id===c.id);if(!ca)continue;const g=GRADES.filter(g=>ca.fellows[g]!==c.fellows[g]);if(g.length)out.push(`<b>${esc(c.name)} Fellows</b>: ${g.map(x=>`${x}th ${ca.fellows[x]} → ${c.fellows[x]}`).join(", ")}`);
    const ra=ca.rooms.filter(r=>r.active).length,rb=c.rooms.filter(r=>r.active).length;if(ra!==rb)out.push(`<b>${esc(c.name)} rooms in use</b>: ${ra} → ${rb}`);
    if(ca.nights.join()!==c.nights.join())out.push(`<b>${esc(c.name)} nights</b>: ${ca.nights.join(", ")||"none"} → ${c.nights.join(", ")||"none"}`);}
  const sl={cohortSize:"Cohort size",seniorCohortSize:"Senior cohort size",learningNights:"Nights per PM",seniorNights:"Nights per counselor",pmRatio:"Fellows per PM target",basis:"Cohorts sized by",attendPct:"Expected attendance",maxSpan:"Direct-report limit",adminPerFTE:"Admin and benefits per FTE"};
  for(const k in sl) if(A.settings[k]!==B.settings[k]) out.push(`<b>${sl[k]}</b>: ${esc(A.settings[k])} → ${esc(B.settings[k])}`);
  return out;
}

function pdfPage(root,title,sub){
  const R=root.getBoundingClientRect(),pad=32,head=64;
  const W=Math.ceil(Math.max(R.width+pad*2,980)),H=Math.ceil(R.height+pad*2+head);
  const ops=["0.75 0 0 0.75 0 0 cm","1 1 1 rg 0 0 "+W+" "+H+" re f"];
  const ox=x=>x-R.left+pad,oy=y=>y-R.top+pad+head,Y=y=>H-y;
  const txt=(t,x,y,size,bold,ital,col,tz)=>ops.push(`BT /F${bold?(ital?4:2):(ital?3:1)} ${size.toFixed(2)} Tf ${pdfRGB(col)} rg ${(tz||100).toFixed(1)} Tz 1 0 0 1 ${x.toFixed(2)} ${Y(y).toFixed(2)} Tm (${winAnsi(t)}) Tj ET`);

    const bg=cssRGB(cs.backgroundColor);if(bg)ops.push(`${pdfRGB(bg)} rg ${pdfRR(x,Y(y+h),w,h,rad)} f`);
    const sd=["Top","Right","Bottom","Left"].map(k=>({w:parseFloat(cs["border"+k+"Width"])||0,c:cssRGB(cs["border"+k+"Color"]),s:cs["border"+k+"Style"]}));
    const vis=sd.map(b=>b.w>0&&b.c&&b.s!=="none"&&b.s!=="hidden");
    const dashOf=b=>b.s==="dashed"?`[${(b.w*3).toFixed(1)} ${(b.w*2.2).toFixed(1)}] 0 d`:"[] 0 d";
    if(vis.every(Boolean)&&sd.every(b=>b.w===sd[0].w&&b.s===sd[0].s)){const b=sd[0];ops.push(`${pdfRGB(b.c)} RG ${b.w} w ${dashOf(b)} ${pdfRR(x+b.w/2,Y(y+h-b.w/2),w-b.w,h-b.w,Math.max(0,rad-b.w/2))} S`);}

  }
  // org chart connector lines are CSS pseudo-elements, so draw them from the card positions
  const lc=[0.761,0.780,0.812];
  root.querySelectorAll(".kids.row").forEach(k=>{
    const pc=k.previousElementSibling;if(!pc)return;
    const kr=k.getBoundingClientRect(),pr=pc.getBoundingClientRect(),top=oy(kr.top),bus=top+11,drop=top+22,pcx=ox(pr.left+pr.width/2);
    line(pcx,oy(pr.bottom),pcx,bus,lc,1.5);
    const cs=[...k.children].map(c=>c.querySelector(".card")).filter(Boolean).map(c=>{const r=c.getBoundingClientRect();return ox(r.left+r.width/2);});
    if(cs.length>1)line(Math.min(...cs),bus,Math.max(...cs),bus,lc,1.5);

  while((n=tw.nextNode())){
    if(!n.data.trim())continue;const pe=n.parentElement,cs=getComputedStyle(pe);if(cs.display==="none"||cs.visibility==="hidden")continue;
    const size=parseFloat(cs.fontSize)||12,bold=(parseInt(cs.fontWeight,10)||400)>=600,ital=cs.fontStyle==="italic",col=cssRGB(cs.color)||[0,0,0],up=cs.textTransform==="uppercase";
    const lines=[],re=/\S+/g;let m;
    while((m=re.exec(n.data))){const rg=document.createRange();rg.setStart(n,m.index);rg.setEnd(n,m.index+m[0].length);const rr=rg.getClientRects();if(!rr.length)continue;const a=rr[0],z=rr[rr.length-1];
      let L=lines.find(l=>Math.abs(l.top-a.top)<3);if(!L){L={top:a.top,bottom:a.bottom,left:a.left,right:z.right,words:[]};lines.push(L);}
      L.words.push(m[0]);L.left=Math.min(L.left,a.left);L.right=Math.max(L.right,z.right);L.bottom=Math.max(L.bottom,a.bottom);}
    for(const L of lines){let t=L.words.join(" ");if(up)t=t.toUpperCase();
      const avail=L.right-L.left,need=pdfMeasure(t,size,bold,ital);const tz=need>avail+0.5&&avail>0?Math.max(55,avail/need*100):100;
      txt(t,ox(L.left),oy(L.top+(L.bottom-L.top)*0.79),size,bold,ital,col,tz);}
  }
  return {w:W*0.75,h:H*0.75,content:ops.join("\n")};
}
function pdfBytes(pages,title){
  const objs=[],add=o=>{objs.push(o);return objs.length;};
  const cat=add(""),pagesId=add("");
  const F=["Helvetica","Helvetica-Bold","Helvetica-Oblique","Helvetica-BoldOblique"].map(f=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`));
  const kids=pages.map(pg=>{const c=add(`<< /Length ${pg.content.length} >>\nstream\n${pg.content}\nendstream`);
    return add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pg.w.toFixed(2)} ${pg.h.toFixed(2)}] /Resources << /Font << /F1 ${F[0]} 0 R /F2 ${F[1]} 0 R /F3 ${F[2]} 0 R /F4 ${F[3]} 0 R >> >> /Contents ${c} 0 R >>`);});
  objs[cat-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
  objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
  const info=add(`<< /Title (${winAnsi(title)}) /Producer (BRYC Front Office) >>`);
  let out="%PDF-1.4\n%âãÏÓ\n";const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n${offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")}trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b;
}
async function saveFile(name,blob){
  let dl=null;try{dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null;}catch(e){dl=null;}
  if(dl&&typeof dl.save==="function"){
    try{await dl.save({filename:name,data:blob});toast("PDF saved");}
    catch(err){const c=err&&err.code;toast(c==="declined"?"Download cancelled.":c==="rate_limited"?"A download prompt is already open.":"Downloads aren't available in this view.");}
    return;
  }
  try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("PDF downloaded");}
  catch(e){toast("Downloads aren't available in this view.");}
}
let pdfBusy=false;
async function exportPDF(){
  if(!S||pdfBusy)return;pdfBusy=true;toast("Making your PDF…");
  const host=document.createElement("div");host.className="pdf-host";host.setAttribute("aria-hidden","true");
  host.innerHTML=`<div style="width:1400px">${boardMatrixHTML(true)}</div><div style="display:inline-block;margin-top:40px;padding:8px">${chartHTML(true)}</div>`;
  document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const m=D.m,date=new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
    const sub=`${S.name} · ${date} · ${m.filled} filled ${pl(m.filled,"seat")} · ${m.unfilled} open or planned · ${f1(m.fte)} FTE`;
    const pages=[pdfPage(host.querySelector(".matrix"),"BRYC Front Office: Board",sub),pdfPage(host.querySelector(".chart"),"BRYC Front Office: Org chart",sub)];
    const bytes=pdfBytes(pages,"BRYC Front Office: "+S.name);

  }catch(err){toast("Couldn't make the PDF. "+((err&&err.message)||""));}
  finally{host.remove();pdfBusy=false;}
}

  if(!data.length)return `<p class="muted">No pay entered yet.</p>`;
  const max=Math.max(1,...data.map(d=>d.base+d.bonus));
  const W=Math.max(320,data.length*74),H=190,sc=(H-46)/max;
  let s=`<div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Pay by year">`;
  data.forEach((d,i)=>{const x=18+i*72,b=H-24;let y=b;
    [["base","var(--v-hustle)"],["bonus","var(--v-integrity)"]].forEach(([k,c])=>{const h=d[k]*sc;if(h>0){y-=h;s+=`<rect x="${x}" y="${y}" width="44" height="${h}" rx="3" style="fill:${c}"><title>${esc(d.label+" "+k+": "+money0(d[k]))}</title></rect>`;}});
    s+=`<text x="${x+22}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--muted)" font-family="Figtree, sans-serif">${esc(d.label)}</text>`;
    if(i){const p=data[i-1],a=p.base+p.bonus,c=d.base+d.bonus;if(a&&c){const ch=(c-a)/a*100;s+=`<text x="${x+22}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" style="fill:${ch>=0?"var(--ok)":"var(--crit)"}" font-family="Figtree, sans-serif">${ch>=0?"+":"−"}${Math.abs(ch).toFixed(1)}%</text>`;}}
  });
  return s+`</svg></div><div class="legend" style="margin-top:4px"><span class="small muted"><i class="sw" style="background:var(--v-hustle)"></i> Base</span><span class="small muted"><i class="sw" style="background:var(--v-integrity)"></i> Bonus</span></div>`;

function parseImport(text,teams){

  if(!lines.length)return [];
  const split=l=>l.includes("\t")?l.split("\t"):l.split(",");

  const first=split(lines[0]).map(x=>x.trim().toLowerCase());
  const looksHeader=first.some(x=>/year|title|team|base|salary|bonus|other|milestone/.test(x))&&!first.some(x=>/^\D*\d{2,}$/.test(x)&&/py|fy|\d/.test(x)&&!/year/.test(x));
  if(looksHeader){cols=first.map(x=>/milestone/.test(x)?"milestone":/bonus/.test(x)?"bonus":/other|stipend/.test(x)?"other":/base|salary/.test(x)?"base":/team/.test(x)?"team":/title|role/.test(x)?"title":/year|py|fy/.test(x)?"label":"skip");lines.shift();}
  const money=v=>{const n=Number(String(v||"").replace(/[$,\s]/g,""));return Number.isFinite(n)?n:0;};
  return lines.map(l=>{const c=split(l);const r={label:"",title:"",team:"",base:0,bonus:0,other:0,milestone:""};cols.forEach((k,i)=>{if(k==="skip"||c[i]==null)return;const v=c[i].trim();if(["base","bonus","other"].includes(k))r[k]=money(v);else r[k]=v;});
    const t=teams.find(x=>x.name.toLowerCase()===r.team.toLowerCase()||x.id===r.team.toLowerCase());r.teamId=t?t.id:"";return r;}).filter(r=>r.label);
}

  switch(a){
    case "b-band":setPersonLevel(pid,v);break;
    case "b-person":B.sel=v;B.year=null;B.pop=null;B.confirm=null;B.importRows=null;try{localStorage.setItem("bryc-build-person",v);}catch(e){}render();break;
    case "b-yfield":bMut(pid,d=>{const y=d.years.find(x=>x.id===B.year);if(!y)return;const f=ds.field;y[f]=f==="note"?v:v.trim();if(f==="label"){if(!y.label)y.label="Year";sortYears(d);}});break;
    case "b-ycheck":bMut(pid,d=>{const y=d.years.find(x=>x.id===B.year);if(!y)return;if(ds.field==="inProgress"&&el.checked)d.years.forEach(x=>{x.inProgress=false;});y[ds.field]=el.checked;});break;
    case "b-email":bMut(pid,d=>{d.email=v.trim();});break;
    case "b-okr":bMut(pid,d=>{const y=d.years.find(x=>x.id===B.year);if(!y||!Array.isArray(y.okras))return;const k=y.okras[num(ds.i)];if(!k)return;if(ds.field==="score")k.score=v===""?null:Math.max(0,Math.min(100,num(v)));else k.t=v.trim();});break;
    case "b-pay":payMut(pid,p=>{const cur=p.years[ds.year]||{};cur[ds.field]=(ds.field==="raiseDate"||ds.field==="note")?v.trim():(v===""?null:Math.max(0,num(v)));p.years[ds.year]=cur;});break;
    case "b-prefix":{const pfx=v.trim().slice(0,6)||"PY";B.meta=Object.assign({},B.meta,{prefix:pfx});if(isAdmin){bQueue("buildmeta/settings",{prefix:pfx});}render();break;}
  }
}
document.addEventListener("submit",async e=>{
  if(!e.target||e.target.id!=="scenNameForm")return;e.preventDefault();
  const inp=$("#scenNewName"),name=(inp?inp.value:"").trim(),mode=ui.nameDlg&&ui.nameDlg.mode;ui.nameDlg=null;
  if(mode==="rename"){if(name&&name!==S.name){mutate(s=>{s.name=name;});toast("Renamed");}else render();return;}
  const nm=name||"Copy of "+S.name;
  await createScenario(Object.assign(clone(S),{name:nm,kind:"draft"}),`Saved “${nm}”. You're editing it now.`);
  render();
});
document.addEventListener("submit",async e=>{
  if(!e.target||e.target.id!=="bGate")return;e.preventDefault();
  const vals=RIDDLES.map((r,i)=>{const el=$("#bRiddle"+i);return el?el.value:"";});
  const res=await Promise.all(RIDDLES.map((r,i)=>checkRiddle(vals[i],r.h)));
  if(res.every(Boolean)){B.unlocked=true;B.gateMsg="";try{sessionStorage.setItem("bryc-build2","1");}catch(err){}render();}
  else{B.gateMsg="Not quite. Try again.";render();RIDDLES.forEach((r,i)=>{const el=$("#bRiddle"+i);if(el)el.value=res[i]?vals[i]:"";});const bad=res.findIndex(x=>!x);const el=$("#bRiddle"+bad);if(el)el.focus();}
});

/* ---------- boot ---------- */
async function boot(){
  render();
  loadTimer=setTimeout(()=>{if(phase==="loading"){phaseMsg="Still loading. Your scenarios can't be reached right now.";render();}},10000);
  const c=window.claude;
  if(!c||typeof c.use!=="function"){phase="nodb";clearTimeout(loadTimer);render();return;}
  let dbNs=null,userNs=null;
  try{[dbNs,userNs]=await Promise.all([c.use("db"),c.use("user")]);}catch(err){}
  db=dbNs;userCap=userNs;
  if(userCap){try{meId=await userCap.id();const w=await userCap.can("data.write");if(w===false)canWrite=false;isAdmin=!!(await userCap.canEdit());}catch(err){}}
  if(!db){phase="nodb";clearTimeout(loadTimer);render();return;}
  db.collection("scenarios").onSnapshot(onScenarios,err=>{clearTimeout(loadTimer);if(!S){phase="error";phaseMsg=err&&err.code==="revoked"?"Your access to this page changed.":"The scenarios couldn't be loaded. Reload the page to try again.";}else{saveError="Lost the live connection. Reload to keep editing.";}render();});
}
setInterval(()=>{if(S&&!dirty&&!saving)renderSave(),resolveNames();},60000);
boot();
})();
</script>
